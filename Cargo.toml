[package]
name = "openai_api"
version = "2.3.0"
edition = "2021"
repository = "https://github.com/octri-dev/openai-rust-unofficial-demo-sdk"

[lib]
name = "openai_api"
path = "src/lib.rs"

[features]
default = []
# Enables the async variants — `sdk_request_async`, `*_async` methods, etc.
# Behind a feature flag so users on sync-only stacks don't pull in tokio.
async = ["dep:reqwest", "dep:tokio", "dep:futures"]

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["time", "macros"], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
regex = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.dev]
# Large schemas can expose thousands of public model types. Omitting local
# debug symbols keeps SDK validation builds fast and memory-bounded without
# changing release artifacts or downstream consumers.
debug = 0

[profile.test]
debug = 0
